# Local development only. Never reuse these settings or credentials in a remote environment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ricaurte}
      # Required: set POSTGRES_PASSWORD in .env (git-ignored). Compose fails if it is missing.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ricaurte_tours}
    ports:
      # Bound to loopback only: the database is not reachable from the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ricaurte_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  playwright:
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    profiles: ["tools"]
    working_dir: /work/apps/web
    volumes:
      - ./:/work
    ipc: host
    init: true
    user: pwuser
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BASE_URL: http://host.docker.internal:3000
    command: ["npx", "playwright", "test"]
volumes:
  ricaurte_data:
