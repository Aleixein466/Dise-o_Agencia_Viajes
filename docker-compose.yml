services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ricaurte
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: ricaurte_tours
    ports:
      - "5432:5432"
    volumes:
      - ricaurte_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ricaurte -d ricaurte_tours"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ricaurte_data:
